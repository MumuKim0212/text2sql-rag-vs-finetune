[project]
name = "rag-text2sql"
version = "0.1.0"
description = "Text-to-SQL: RAG vs fine-tuning comparison study"
requires-python = ">=3.11"
dependencies = [
    "datasets>=2.20",
    "pandas>=2.2",
    "anthropic>=0.40",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_text2sql"]
